name: Agile DevOps CI
run-name: ${{ github.actor }} code integration test
on:
  push:
  pull_request:
    branches:
      - develop
      - staging
      - release
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt
      - run: pytest
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:pyproject.toml" | python -c "import sys, tomllib; print(tomllib.load(sys.stdin.buffer).get('project', {}).get('version'))")
          CURRENT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('version'))")

          if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "Version $CURRENT_VERSION is unchanged. Update pyproject.toml before merging."
            exit 1
          fi
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt
      - run: ruff check . --select ALL