name: Agile DevOps CD
run-name: ${{ github.actor }} code deployment test

on: [push]
  # push:
  #   branches:
  #     - main
  #     - master
  #     - develop

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('version') or tomllib.load(open('pyproject.toml', 'rb')).get('tool', {}).get('poetry', {}).get('version'))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release notes
        id: release_notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "${VERSION}-demo" HEAD^ 2>/dev/null || true)
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"

          echo "TAG_MESSAGE=$(git log -1 --format='%h %s' HEAD)" >> "$GITHUB_ENV"
          {
            echo "Release since ${LAST_TAG:-initial commit}"
            echo
            git log --format='- %h %s' --reverse "$RANGE"
          } > release-notes.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -f "${{ env.VERSION }}-demo" -m "${{ env.TAG_MESSAGE }}"
          git push origin -f "${{ env.VERSION }}-demo"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.VERSION }}-demo" --title "${{ env.VERSION }}-demo" --notes-file release-notes.txt --target "${{ github.sha }}" --latest