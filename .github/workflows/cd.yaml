name: Agile DevOps CD
run-name: ${{ github.actor }} code deployment test

on:
  push:
    branches:
      - develop
      - staging
      - release

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract project version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('version') or tomllib.load(open('pyproject.toml', 'rb')).get('tool', {}).get('poetry', {}).get('version'))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          case "${{ github.ref_name }}" in
            develop)
              release_tag="${VERSION}-dev"
              latest_flag=
              ;;
            staging)
              release_tag="${VERSION}-demo"
              latest_flag=
              ;;
            release)
              release_tag="${VERSION}"
              latest_flag=--latest
              ;;
            *)
              echo "Unsupported branch."
              exit 1
              ;;
          esac

          if git tag -l "$release_tag" | grep -q .; then
            if [ "${{ github.ref_name }}" = "release" ]; then
              echo "Tag $release_tag already exists. Update the project version before releasing."
              exit 1
            fi

            echo "Tag $release_tag already exists. Skipping prerelease on ${{ github.ref_name }}."
            exit 0
          fi

          last_tag=$(git describe --tags --abbrev=0 --match "${VERSION}-*" HEAD^ 2>/dev/null || true)
          range=${last_tag:+$last_tag..}HEAD
          tag_message=$(git log -1 --format='%h %s' HEAD)

          printf 'Release notes since %s\n\n' "${last_tag:-initial commit}" > release-notes.txt
          git log --format='- %h %s' --reverse "$range" >> release-notes.txt

          git tag -f "$release_tag" -m "$tag_message"
          git push origin -f "$release_tag"

          gh release create "$release_tag" \
            --title "$release_tag" \
            --notes-file release-notes.txt \
            --target "${{ github.sha }}" \
            $latest_flag