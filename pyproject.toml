[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-devops"
version = "0.4.1"
description = "FastAPI version of the Agile DevOps lab backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.10,<3.0",
  "openai>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "crewai >=0.1.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D103", "E402", "E501", "PLR2004", "S101", "S105"]
